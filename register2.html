<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>注冊頁面</title>
  <style>
    body {
      font-family: 'Arial';
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 80px;
      background-color: #f0f2f5;
    }
    #studentFields, #mentorFields{
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    input, select, button {
      margin-top: 10px;
      padding: 10px;
      font-size: 16px;
      width: 250px;
    }
    a { margin-top: 10px; }
    #status { margin-top: 14px; }
  </style>
</head>
<body>
  <h1>注冊系統</h1>

  <!-- 角色選擇 -->
  <select id="roleSelect">
    <option value="student">學生</option>
    <option value="mentor">老師</option>
  </select>

  <!-- 學生欄位 -->
  <div id="studentFields">
    <input type="text" id="studentName" placeholder="學生姓名" required>
    <input type="text" id="studentID" placeholder="學號" required>
    <input type="email" id="studentEmail" placeholder="電子郵件" required>

    <!-- 由 MetaMask 自動填入 -->
    <input type="text" id="walletId" placeholder="MetaMask 錢包地址 (0x...)" readonly>
    <button type="button" id="btnConnectStudent">連接 MetaMask</button>
  </div>

  <!-- 老師欄位 -->
  <div id="mentorFields" style="display: none;">
    <input type="text" id="mentorName" placeholder="教職員姓名" required>
    <input type="text" id="mentorID" placeholder="教職員編號" required>
    <input type="email" id="mentorEmail" placeholder="電子郵件" required>

    <input type="text" id="mentorwalletId" placeholder="MetaMask 錢包地址 (0x...)" readonly>
    <button type="button" id="btnConnectMentor">連接 MetaMask</button>
  </div>

  <a href="https://www.youtube.com/watch?v=G_JiU-6dcu8&ab_channel=RyanScribner" target="_blank">可以先看 tutorial</a>
  <button type="button" id="btnMMDownload">沒有 MetaMask🦊？</button>
  <button type="button" id="btnRegister">🚪 注冊帳號</button>

  <p id="status"></p>

  <script>
    // ===== 視圖切換 =====
    function changeRole(){
      const role = document.getElementById("roleSelect").value;
      document.getElementById("studentFields").style.display = (role === "student") ? "flex" : "none";
      document.getElementById("mentorFields").style.display = (role === "mentor") ? "flex" : "none";
      // 切換角色時清空狀態
      document.getElementById("status").innerText = "";
    }

    // ===== 連結 MetaMask，將地址寫入指定 input =====
    async function connectMetaMask(targetInputId) {
      const statusEl = document.getElementById("status");

      if (!window.ethereum) {
        statusEl.innerText = "找不到 MetaMask，請先安裝擴充套件。";
        return;
      }
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        const addr = (accounts && accounts.length > 0) ? accounts[0] : "";
        document.getElementById(targetInputId).value = addr;
        statusEl.innerText = addr ? "已連接 MetaMask。" : "未取得帳號，請在 MetaMask 選擇帳號。";
      } catch (e) {
        console.error(e);
        statusEl.innerText = "連接 MetaMask 失敗，請再試一次。";
      }
    }

    // 帳號切換時自動更新目前角色的錢包欄位
    if (window.ethereum) {
      window.ethereum.on("accountsChanged", (accounts) => {
        const statusEl = document.getElementById("status");
        const role = document.getElementById("roleSelect").value;
        const targetId = (role === "mentor") ? "mentorwalletId" : "walletId";
        const addr = (accounts && accounts.length > 0) ? accounts[0] : "";
        document.getElementById(targetId).value = addr;
        statusEl.innerText = addr ? "已切換 MetaMask 帳號。" : "MetaMask 未連接任何帳號。";
      });
    }

    // ===== 下載 MetaMask =====
    function openMetaMaskDownload() {
      window.open("https://metamask.io/download", "_blank");
    }

    // ===== 送出註冊 =====
    async function register() {
      const role = document.getElementById("roleSelect").value;
      let data = { role };
      const statusEl = document.getElementById("status");

      if (role === "student") {
        const username = document.getElementById("studentName").value.trim();
        const studentID = document.getElementById("studentID").value.trim();
        const email = document.getElementById("studentEmail").value.trim();
        const walletId = (document.getElementById("walletId").value || "").trim();

        if (!username || !studentID || !email || !walletId) {
          statusEl.innerText = "請填寫完整學生資訊，並先連接 MetaMask。";
          return;
        }
        // 如需錢包格式檢查可開啟：
        // if (!/^0x[a-fA-F0-9]{40}$/.test(walletId)) {
        //   statusEl.innerText = "錢包地址格式不正確（需為 0x 開頭的 42 碼）。";
        //   return;
        // }
        data = { ...data, username, studentID, email, walletId };

      } else if (role === "mentor") {
        const username = document.getElementById("mentorName").value.trim();
        const mentorID = document.getElementById("mentorID").value.trim();
        const email = document.getElementById("mentorEmail").value.trim();
        const walletId = (document.getElementById("mentorwalletId").value || "").trim();

        // 修正：必填條件應該是「有一個沒填就報錯」
        if (!username || !mentorID || !email || !walletId) {
          statusEl.innerText = "請填寫完整老師資訊。";
          return;
        }
        // if (!/^0x[a-fA-F0-9]{40}$/.test(walletId)) {
        //   statusEl.innerText = "錢包地址格式不正確（需為 0x 開頭的 42 碼）。";
        //   return;
        // }
        data = { ...data, username, mentorID, email, walletId };
      }

      try {
        const res = await fetch("http://localhost:3000/api/users/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (res.ok) {
          statusEl.innerText = "✅ 註冊成功！即將前往登入頁…";
          window.location.href = "login2.html"; // 依你的實際檔名調整
        } else {
          statusEl.innerText = `❌ 註冊失敗：${result.message || "請確認資料正確性"}`;
        }
      } catch (err) {
        console.error(err);
        statusEl.innerText = "⚠️ 無法連線到伺服器，請稍後再試";
      }
    }

    // ===== 綁定事件 & 初始狀態 =====
    document.addEventListener("DOMContentLoaded", () => {
      // 初始依預設角色顯示表單
      changeRole();

      document.getElementById("roleSelect").addEventListener("change", changeRole);
      document.getElementById("btnConnectStudent").addEventListener("click", () => connectMetaMask("walletId"));
      document.getElementById("btnConnectMentor").addEventListener("click", () => connectMetaMask("mentorwalletId"));
      document.getElementById("btnMMDownload").addEventListener("click", openMetaMaskDownload);
      document.getElementById("btnRegister").addEventListener("click", register);
    });
  </script>
</body>
</html>
