<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>登入系統（Wallet Only）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #121826;
      --primary: #4caf50;
      --primary-hover: #45a049;
      --muted: #9aa4b2;
      --text: #e5e7eb;
      --shadow: 0 10px 30px rgba(0,0,0,0.35);
      --radius: 14px;
      --border: 1px solid #1f2937;
    }
    * { box-sizing: border-box; }
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 64px;
      background: radial-gradient(1200px 600px at 20% -10%, #12233f 0%, transparent 60%),
                  radial-gradient(900px 600px at 100% 0%, #1a2638 0%, transparent 60%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    h1 { margin-bottom: 8px; }
    #loginBox {
      width: min(440px, 100%);
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      border: var(--border);
    }
    label { font-size: 14px; color: #cbd5e1; display: block; margin-top: 10px; }
    input, select, button {
      margin-top: 8px;
      margin-bottom: 12px;
      padding: 12px;
      font-size: 16px;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #273041;
      border-radius: 10px;
      background: #0f172a;
      color: var(--text);
    }
    input[readonly] {
      background: #0c1324;
      color: #cbd5e1;
    }
    input::placeholder { color: #64748b; }
    input:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    button {
      background-color: var(--primary);
      color: white; border: none; border-radius: 10px; cursor: pointer;
      transition: background .15s ease, transform .05s ease;
    }
    button:hover { background-color: var(--primary-hover); }
    button:active { transform: translateY(1px); }
    .row { display: flex; gap: 10px; }
    .row > button { flex: 1; }
    #status { min-height: 20px; font-size: 14px; color: #cbd5e1; margin-top: 6px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: -6px; margin-bottom: 10px;}
    a.link { font-size: 14px; margin-top: 8px; display: inline-block; color: #93c5fd; text-decoration: none;}
    a.link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h1>登入系統</h1>
  <div id="loginBox">
    <!-- 角色選擇：保留但不傳到後端 -->
    <label for="roleSelect">角色（可選）</label>
    <select id="roleSelect">
      <option value="student">學生</option>
      <option value="mentor">老師</option>
    </select>
    <div class="hint">目前登入只依據錢包位址，不會傳送角色到後端。</div>

    <!-- NEW: 名字（必填） -->
    <label for="username">名字（必填）</label>
    <input id="username" type="text" placeholder="請輸入名字" autocomplete="name" />

    <label for="walletId">錢包位址</label>
    <input id="walletId" type="text" placeholder="0x..." readonly />

    <div class="row">
      <button type="button" id="btnConnect">連接 MetaMask</button>
      <button type="button" id="btnMM">安裝 MetaMask</button>
    </div>

    <button type="button" id="btnLogin">🚪 使用錢包登入</button>

    <div id="status"></div>

    <a class="link" href="register2.html">還沒有帳號？前往註冊</a>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const walletInput = document.getElementById("walletId");
    const roleSelect = document.getElementById("roleSelect");
    const usernameInput = document.getElementById("username"); // NEW

    function setStatus(msg) { statusEl.textContent = msg || ""; }

    // 連接 MetaMask：讀取當前選擇的帳戶並寫入欄位
    async function connectMetaMask() {
      if (!window.ethereum) {
        setStatus("找不到 MetaMask，請先安裝或點下方按鈕。");
        return;
      }
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        const addr = (accounts && accounts[0]) ? accounts[0] : "";
        walletInput.value = addr;
        setStatus(addr ? "已連接 MetaMask。" : "請在 MetaMask 選擇帳號。");
      } catch (err) {
        console.error(err);
        setStatus("連接 MetaMask 失敗，請重試或檢查擴充套件權限。");
      }
    }

    // 監聽帳號切換，動態更新欄位
    if (window.ethereum) {
      window.ethereum.on("accountsChanged", accounts => {
        const addr = (accounts && accounts[0]) ? accounts[0] : "";
        walletInput.value = addr;
        // 帳號切換時，清除舊 token（若有）
        if (addr) {
          localStorage.removeItem("token");
          localStorage.removeItem("user");
          setStatus("已切換 MetaMask 帳號，請重新登入。");
        } else {
          setStatus("MetaMask 未連接任何帳號。");
        }
      });
    }

    // 登入：送 walletId + username（名字必填）
    async function login() {
      const walletId = (walletInput.value || "").trim();
      const username = (usernameInput.value || "").trim(); // NEW

      if (!walletId) {
        setStatus("請先連接 MetaMask 以取得錢包位址。");
        return;
      }
      if (!username) { // NEW
        setStatus("請先輸入名字。");
        return;
      }

      const payload = { walletId, username }; // NEW

      try {
        setStatus("登入中…");
        const res = await fetch("http://localhost:3000/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          const msg = data.message || data.error || ("登入失敗（HTTP " + res.status + "）");
          setStatus("❌ " + msg);
          return;
        }

        // 假設後端回：{ token, user }
        if (data.token) localStorage.setItem("token", data.token);

        const selectedRole = (roleSelect.value === "mentor") ? "mentor" : "student";
        const serverUser = data.user || {};
        // NEW: 以剛填的名字優先
        const finalName = username || serverUser.username || serverUser.name || ("使用者_" + walletId.slice(2, 8));

        const mergedUser = {
          ...serverUser,
          username: finalName, // NEW
          walletId,
          role: selectedRole
        };
        localStorage.setItem("user", JSON.stringify(mergedUser));

        setStatus("✅ 登入成功，前往討論區…");
        window.location.href = "post.html";
      } catch (err) {
        console.error(err);
        setStatus("⚠️ 連線失敗，請確認本機 API 是否在 3000 埠運作。");
      }
    }

    // 綁定事件
    document.getElementById("btnConnect").addEventListener("click", connectMetaMask);
    document.getElementById("btnMM").addEventListener("click", () => {
      window.open("https://metamask.io/download", "_blank");
    });
    document.getElementById("btnLogin").addEventListener("click", login);

    // 初始提示
    setStatus("請先連接 MetaMask、填好名字，再按登入。");

    // 若是註冊後回來，顯示成功提示並嘗試帶入已授權帳號
    (function showRegisteredNotice() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("registered") === "1") {
        setStatus("✅ 註冊成功！請使用錢包登入。");
        localStorage.removeItem(" token");
        localStorage.removeItem("user");
        if (window.ethereum) {
          window.ethereum.request({ method: "eth_accounts" })
            .then((accounts) => {
              if (accounts && accounts[0]) {
                walletInput.value = accounts[0];
              }
            }).catch(() => {});
        }
      } else {
        // 若已授權 MetaMask，嘗試自動帶入
        if (window.ethereum) {
          window.ethereum.request({ method: "eth_accounts" })
            .then((accounts) => {
              if (accounts && accounts[0]) {
                walletInput.value = accounts[0];
                setStatus("已偵測到已授權帳號，可直接登入。");
              }
            }).catch(() => {});
        }
      }
    })();
  </script>
</body>
</html>
