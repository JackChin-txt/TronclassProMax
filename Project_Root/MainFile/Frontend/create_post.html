<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<title>發表新文章</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  :root{
    --bg:#0b0f19; --card:#121826; --card-2:#0f172a;
    --muted:#9aa4b2; --text:#e5e7eb; --border:#1f2937;
    --shadow:0 10px 30px rgba(0,0,0,.35); --radius:14px;
    --primary:#4caf50; --primary-hover:#45a049;
    --accent:#3b82f6;
  }
  *{box-sizing:border-box}
  body{
    font-family:Arial,"Microsoft JhengHei",sans-serif; margin:0; min-height:100vh; color:var(--text);
    background: radial-gradient(1200px 600px at 20% -10%, #12233f 0%, transparent 60%),
                radial-gradient(900px 600px at 100% 0%, #1a2638 0%, transparent 60%), var(--bg);
  }
  .nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:16px 20px;
       background:rgba(9,12,20,.65);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
  .nav h1{font-size:20px;margin:0}
  .nav .spacer{flex:1}
  .btn{padding:10px 14px;border:none;border-radius:10px;background:var(--card-2);color:var(--text);
       cursor:pointer;border:1px solid #273041;transition:background .15s ease,transform .05s ease}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--primary);border-color:transparent}
  .btn.primary:hover{background:var(--primary-hover)}
  .btn.linklike{background:transparent;border-color:transparent;color:#93c5fd}
  .btn.linklike:hover{text-decoration:underline}
  .wrap{max-width:820px;margin:24px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .form{padding:20px}
  label{display:block;font-size:14px;color:#cbd5e1;margin-top:10px}
  input[type="text"], textarea{
    width:100%; padding:12px; margin-top:8px; margin-bottom:14px;
    border:1px solid #273041; border-radius:10px; outline:none; background:#0f172a; color:var(--text);
  }
  input::placeholder, textarea::placeholder{color:#64748b}
  input:focus, textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .help{font-size:12px;color:var(--muted);margin-top:-6px;margin-bottom:10px}
  .msg{margin-top:8px;font-size:14px}
  .msg.error{color:#fecaca}
  .msg.ok{color:#bbf7d0}
</style>
</head>
<body>
  <div class="nav">
    <h1>發表新文章</h1>
    <div class="spacer"></div>
    <button class="btn linklike" onclick="location.href='post.html'">← 返回清單</button>
    <button class="btn" onclick="logout()">登出</button>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="form">
        <label for="title">標題</label>
        <input id="title" type="text" placeholder="請輸入標題…" maxlength="120"/>

        <label for="content">內容</label>
        <textarea id="content" rows="8" placeholder="請輸入內容…"></textarea>
        <div class="help">送出後會寫入後端並導回文章清單（若回傳新 ID 則直達單篇頁）。</div>

        <div class="row">
          <button class="btn primary" onclick="submitPost()">送出</button>
          <button class="btn" onclick="resetForm()">清空</button>
        </div>

        <div id="msg" class="msg"></div>
      </div>
    </div>
  </div>

<script>
  // === API 根路徑：同網域可留空；否則指向後端 ===
  const API_BASE = (location.origin.includes('localhost:3000') || location.origin.startsWith('http://localhost:3000'))
    ? '' : 'http://localhost:3000';

  // 基本工具
  function logout(){
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    location.href='login2.html';
  }
  function resetForm(){
    document.getElementById('title').value='';
    document.getElementById('content').value='';
    setMsg('');
  }
  function setMsg(t, ok=false){
    const el = document.getElementById('msg');
    el.textContent = t || '';
    el.className = 'msg ' + (ok ? 'ok' : (t ? 'error' : ''));
  }
  function authHeader(){
    const t = localStorage.getItem('token');
    return t ? { 'Authorization': 'Bearer ' + t } : {};
  }
  async function safeJson(res){
    try{ return await res.json(); }catch{ return null; }
  }
  async function safeText(res){
    try{ return await res.text(); }catch{ return ''; }
  }

  // 送出貼文
  async function submitPost(){
    setMsg('');
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();

    if(!title || !content){
      setMsg('請填寫標題與內容'); return;
    }
    const token = localStorage.getItem('token');
    if(!token){
      setMsg('尚未登入，請先登入'); 
      setTimeout(()=>location.href='login2.html', 800);
      return;
    }

    try{
      const res = await fetch(`${API_BASE}/api/posts`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', ...authHeader() },
        body: JSON.stringify({ title, content })
      });

      if(!res.ok){
        const txt = await safeText(res);
        throw new Error(txt || '建立貼文失敗');
      }

      // 優先嘗試讀回傳的貼文（若後端有回 _id/id）
      const data = await safeJson(res);
      setMsg('建立成功，正在跳轉…', true);

      const newId = data && (data._id || data.id);
      if (newId) {
        // 直接導向單篇頁
        setTimeout(()=> location.href = `comment.html?id=${encodeURIComponent(newId)}`, 300);
      } else {
        // 回清單頁
        setTimeout(()=> location.href = 'post.html', 300);
      }
    }catch(err){
      setMsg(err.message || '建立貼文失敗');
    }
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<script type="module">
  import { initPost } from './js/chain/module/post.js';

  const API_URL = 'http://localhost:3000/api';
  const MAP_KEY = 'chainPostIdByCid'; // { [cid]: { type:'uint'|'bytes32'|'string', value:string } }

  // ---------- 小工具 ----------
  const authHeader = () => {
    const t = localStorage.getItem('token');
    return t ? { Authorization: `Bearer ${t}` } : {};
  };
  const setMsg = (txt, ok=false) => {
    const el = document.getElementById('msg');
    if (!el) { txt && console[ok?'log':'warn'](txt); return; }
    el.textContent = txt || '';
    el.className = 'msg ' + (ok ? 'ok' : (txt ? 'error' : ''));
  };
  const safeJson = async (r) => { try { return await r.json(); } catch { return null; } };
  const safeText = async (r) => { try { return await r.text(); } catch { return ''; } };

  const getIface    = (p) => (p?.interface || p?.contract?.interface || null);
  const getContract = (p) => (p?.contract || p);
  const toWire = (t, v) =>
    t === 'bytes32'       ? ethers.utils.id(String(v)) :
    t?.startsWith('uint') ? ethers.BigNumber.from(String(v)) :
                            String(v);

  const loadMap = ()=> { try{ return JSON.parse(localStorage.getItem(MAP_KEY)||'{}'); }catch{ return {}; } };
  const saveMap = (m)=> localStorage.setItem(MAP_KEY, JSON.stringify(m||{}));
  const putMap  = (cid, entry)=> { const m = loadMap(); m[cid]=entry; saveMap(m); };

  // 取合約（拿到 wrapper + 原生合約 + iface）
  async function getPostArtifacts() {
    const provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send('eth_requestAccounts', []);
    let net = await provider.getNetwork();
    if (+net.chainId !== 31337) {
      await window.ethereum.request({ method:'wallet_switchEthereumChain', params:[{ chainId:'0x7a69' }] });
      net = await provider.getNetwork();
    }
    const addrs = await fetch('./js/chain/addresses.json').then(r=>r.json());
    const code  = await provider.getCode(addrs.PostManager);
    if (!code || code === '0x') throw new Error('PostManager 未部署或位址錯誤；請重佈署並更新 ./js/chain/addresses.json');

    const signer  = provider.getSigner();
    const wrapper = await initPost({ provider, signer, address: addrs.PostManager });
    const contract= getContract(wrapper);
    const iface   = getIface(wrapper) || contract.interface;

    return { provider, address:addrs.PostManager, wrapper, contract, iface };
  }

  // 把 ABI 內所有函式印出（助查）
  function logAbiFunctions(iface) {
    const fns = Object.keys(iface?.functions || {});
    console.groupCollapsed('[ABI] functions ('+fns.length+')');
    fns.forEach(k => console.log(' -', k));
    console.groupEnd();
  }

  // 挑選一個「看起來像建立貼文」的函式（合約層）
  function pickCreateLikeSig(iface) {
    const fns = Object.keys(iface?.functions || {});
    if (!fns.length) return null;

    // 1) 直接命中含 createPost 的
    let cand = fns.find(k => /^createpost\(/i.test(k));
    if (cand) return cand;

    // 2) 名稱同時含 create/new/add/publish + post
    const nameScore = fns.map(sig => {
      const name = sig.split('(')[0].toLowerCase();
      let score = 0;
      if (name.includes('post')) score += 2;
      if (/(create|new|add|publish|write)/.test(name)) score += 2;
      // 參數型別偏好：第一個是 string/bytes32/uint，第二個若存在是 string
      const inputs = iface.functions[sig]?.inputs || [];
      const t0 = inputs[0]?.type || '';
      const t1 = inputs[1]?.type || '';
      if (/^(string|bytes32|uint)/.test(t0)) score += 1;
      if (t1 && /^string/.test(t1)) score += 1;
      return { sig, score };
    }).sort((a,b)=>b.score-a.score);

    cand = (nameScore[0]?.score > 0) ? nameScore[0].sig : null;
    if (cand) return cand;

    // 3) 退一步：任何帶 1~2 個參數、第一個是 string/bytes32/uint 的函式
    cand = fns.find(sig => {
      const ins = iface.functions[sig]?.inputs || [];
      if (ins.length===0 || ins.length>2) return false;
      const t0 = ins[0]?.type || '';
      return /^(string|bytes32|uint)/.test(t0);
    });
    return cand || null;
  }

  // 從 receipt 事件推論 on-chain postId（第一個事件第一個參數）
  function normId(v){
    if (v === undefined || v === null) return null;
    if (ethers.BigNumber.isBigNumber(v)) return { type:'uint', value:v.toString() };
    if (typeof v === 'string' && /^0x[0-9a-fA-F]{64}$/.test(v)) return { type:'bytes32', value:v };
    if (typeof v === 'string') return { type:'string', value:v };
    return null;
  }
  function extractPostIdFromReceipt(iface, receipt, contractAddr){
    const addr = String(contractAddr||'').toLowerCase();
    for (const lg of (receipt.logs || [])) {
      if (addr && String(lg.address||'').toLowerCase() !== addr) continue;
      try {
        const ev = iface.parseLog(lg);
        const arr = Array.from(ev?.args || []);
        if (!arr.length) continue;
        const candidate = normId(arr[0]);
        if (candidate) return candidate;
      } catch { /* ignore */ }
    }
    return null;
  }

  // -------- 主流程：後端 → 送鏈（自動選函式） → 等 mined → 存映射 → 跳轉 --------
  window.submitPost = async function submitPost() {
    const btn = document.getElementById('btnSubmit');
    btn && (btn.disabled = true);

    try {
      const title   = (document.getElementById('title')?.value || '').trim();
      const content = (document.getElementById('content')?.value || '').trim();
      if (!title || !content) throw new Error('請填寫標題與內容');

      setMsg('送出中…');

      // 1) 後端建立，拿 CID（= Mongo _id）
      const res  = await fetch(`${API_URL}/posts`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', ...authHeader() },
        body: JSON.stringify({ title, content })
      });
      if (!res.ok) {
        const txt = await safeText(res);
        throw new Error(txt || '建立貼文失敗');
      }
      const data = await safeJson(res);
      const cid  = data?._id || data?.post?._id || data?.result?._id;
      if (!cid) throw new Error('後端未回 _id，無法上鏈');

      // 2) 取得合約資源
      setMsg('鏈上寫入中…');
      const { provider, address, wrapper, contract, iface } = await getPostArtifacts();
      logAbiFunctions(iface);

      // 2a) 先找 ABI 裡最像的建立函式
      let sig = pickCreateLikeSig(iface);
      let receipt = null;

      if (sig) {
        // 直接用原生合約 + 完整簽名
        const ins  = iface.getFunction(sig).inputs.map(i => i.type);
        const args = [ toWire(ins[0], cid) ];
        if (ins.length >= 2) args.push(toWire(ins[1], title || ''));
        console.log('[create] pick', sig, 'args=', args);

        const tx = await contract[sig](...args);
        console.log('🧾 Create sent:', tx.hash);
        receipt = await tx.wait();
        console.log('✅ Create mined: block', receipt.blockNumber);
      } else {
        // 2b) 沒有 ABI 能用：嘗試 wrapper 上常見的方法名
        const candidates = ['createPost','newPost','addPost','publishPost','post','create','writePost'];
        const name = candidates.find(n => typeof wrapper?.[n] === 'function');
        if (!name) {
          throw new Error('ABI 中找不到 createPost 函式，且 wrapper 也沒有常見建立方法。請檢查 initPost 或合約名稱。');
        }
        // 用函式長度推參數數量
        const need = Number(wrapper[name].length || 1);
        const args = need >= 2 ? [cid, title] : [cid];
        console.log('[create(wrapper)] pick', name, 'args=', args);

        const ret  = await wrapper[name](...args);
        const hash = ret?.hash || ret?.tx || ret?.transactionHash;
        if (!hash) throw new Error('建立成功但未取得 tx hash');
        console.log('🧾 Create sent (wrapper):', hash);
        receipt = await provider.waitForTransaction(hash, 1);
        console.log('✅ Create mined (wrapper): block', receipt?.blockNumber);
      }

      // 3) 解析 on-chain postId 並存映射（給 reply 用）
      const mapped = extractPostIdFromReceipt(iface, receipt, address);
      if (mapped) {
        putMap(cid, mapped);
        console.log('[map] CID → onchain postId', cid, '→', mapped);
      } else {
        console.warn('[map] 無法自動取得 on-chain postId（之後 reply 會用 CID/bytes32 嘗試）');
      }

      // 4) 跳單篇頁
      setMsg('建立成功，正在跳轉…', true);
      setTimeout(()=> location.href = `comment.html?id=${encodeURIComponent(cid)}`, 400);
    } catch (e) {
      console.error(e);
      setMsg(e?.message || '建立貼文失敗');
    } finally {
      btn && (btn.disabled = false);
    }
  };

  // 移除舊監聽→只綁一次
  {
    const old = document.getElementById('btnSubmit');
    if (old) {
      const nb = old.cloneNode(true);
      old.parentNode.replaceChild(nb, old);
      nb.addEventListener('click', (ev)=>{ ev.preventDefault(); window.submitPost(); });
    }
  }
</script>
</body>
</html>
