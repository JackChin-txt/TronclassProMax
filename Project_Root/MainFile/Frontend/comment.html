<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<title>文章與留言</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  :root{
    --bg:#0b0f19;--card:#121826;--card-2:#0f172a;--muted:#9aa4b2;--text:#e5e7eb;--border:#1f2937;
    --shadow:0 10px 30px rgba(0,0,0,.35);--radius:14px;--primary:#4caf50;--primary-hover:#45a049;
    --accent:#2563eb;--accentText:#dbeafe;
  }
  *{box-sizing:border-box}
  body{
    font-family:Arial,"Microsoft JhengHei",sans-serif;margin:0;min-height:100vh;color:var(--text);
    background:radial-gradient(1200px 600px at 20% -10%,#12233f 0%,transparent 60%),
               radial-gradient(900px 600px at 100% 0%,#1a2638 0%,transparent 60%),var(--bg)
  }
  .nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:16px 20px;
       background:rgba(9,12,20,.65);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
  .nav h1{font-size:20px;margin:0}.nav .spacer{flex:1}
  .badge-user{font-size:13px;color:#cbd5e1;background:rgba(148,163,184,.15);border:1px solid #273041;border-radius:999px;padding:6px 10px}
  .btn{padding:8px 14px;border-radius:8px;background:var(--card-2);color:var(--text);border:1px solid #273041;cursor:pointer;transition:.15s}
  .btn:hover{background:#1a2335}
  .btn.primary{background:var(--primary);border:none}.btn.primary:hover{background:var(--primary-hover)}
  .wrap{max-width:860px;margin:24px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .post{padding:20px;border-bottom:1px solid var(--border)}
  .post h2{margin:0 0 8px;font-size:22px}
  .meta{font-size:13px;color:#cbd5e1}
  .content{margin-top:10px;white-space:pre-wrap}
  .newc{padding:16px;border-top:1px solid var(--border);display:grid;gap:10px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  textarea{width:100%;background:#0f172a;color:var(--text);border:1px solid #273041;border-radius:8px;padding:10px}
  input[type="datetime-local"]{background:#0f172a;color:#e5e7eb;border:1px solid #273041;border-radius:8px;padding:8px}
  .comments{padding:16px}
  .cmt{background:#0f172a;border:1px solid #273041;border-radius:10px;padding:12px;margin-bottom:12px}
  .cmt.pending{opacity:.9;border-style:dashed}
  .cmt.best{border-color:var(--accent);box-shadow:0 0 0 1px rgba(37,99,235,.35) inset}
  .top{font-size:13px;color:#cbd5e1;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .name{font-weight:600}
  .badge{padding:2px 6px;border-radius:8px;background:var(--accent);color:var(--accentText);font-size:12px}
  .badge.gray{background:#374151;color:#e5e7eb}
  .txt{white-space:pre-wrap}
  .actions{margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .like-btn.active{background:#1e293b}
  .empty{text-align:center;padding:28px;color:var(--muted)}
  .warn{color:#fca5a5;font-size:13px}
</style>
</head>
<body>
  <div class="nav">
    <h1>文章留言</h1>
    <div class="spacer"></div>
    <span id="userBadge" class="badge-user">未登入</span>
    <button class="btn" onclick="location.href='post.html'">← 回清單</button>
    <button class="btn" id="btnLogin" onclick="location.href='login2.html'">登入</button>
    <button class="btn" id="btnLogout" style="display:none" onclick="logout()">登出</button>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="post">
        <h2 id="pTitle">(載入中…)</h2>
        <div class="meta" id="pMeta"></div>
        <div class="content" id="pContent"></div>
      </div>

      <div class="newc">
        <textarea id="cContent" rows="3" placeholder="寫點什麼吧…（只有留言，沒有回覆）"></textarea>
        <div class="row">
          <label class="meta">截止時間：</label>
          <input id="cutoffInput" type="datetime-local"/>
        </div>
        <div class="row">
          <button class="btn primary" id="btnAdd">送出留言</button>
          <span id="cStatus" class="meta"></span>
        </div>
      </div>

      <div id="cList" class="comments"></div>
      <div id="cEmpty" class="empty" style="display:none;">目前沒有留言。</div>
    </div>
  </div>

<script>
  const API = 'http://localhost:3000/api';
  const qs = (k)=> new URLSearchParams(location.search).get(k);
  const postId = qs('id');
  window.API = API;
  window.postId = postId;
  /* ===== 使用者/工具 ===== */
  function getCurrentUser(){ try{ return JSON.parse(localStorage.getItem('user') || '{}'); }catch{ return {}; } }
  function refreshUserBadge(){
    const u=getCurrentUser(); const has=!!(localStorage.getItem('token')||localStorage.getItem('authToken'));
    const name=u.username||u.name||(has?'使用者':'未登入');
    document.getElementById('userBadge').textContent=has?`👤 ${name}`:'未登入';
    document.getElementById('btnLogin').style.display=has?'none':''; document.getElementById('btnLogout').style.display=has?'':'none';
  }
  function logout(){ localStorage.removeItem('token'); localStorage.removeItem('authToken'); localStorage.removeItem('user'); refreshUserBadge(); location.href='login2.html'; }
  function authHeaders(){ const t=localStorage.getItem('token')||localStorage.getItem('authToken'); return t?{'Content-Type':'application/json','Authorization':'Bearer '+t}:{'Content-Type':'application/json'}; }
  function currentUserId(){ try{ const u=JSON.parse(localStorage.getItem('user')||'{}'); return String(u._id||u.id||''); }catch{ return ''; } }
  function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
  function timeAgo(iso){if(!iso)return'';const d=(Date.now()-new Date(iso))/1000;if(d<60)return`${Math.floor(d)} 秒前`;if(d<3600)return`${Math.floor(d/60)} 分鐘前`;if(d<86400)return`${Math.floor(d/3600)} 小時前`;return`${Math.floor(d/86400)} 天前`;}
  function fmt(dt){ try{ return new Date(dt).toLocaleString(); }catch{ return ''; } }

  /* ===== Points Ledger（前端錢包）===== */
  const LEDGER_KEY='pointsLedger'; // { [userId]: points }
  function getLedger(){ try{ return JSON.parse(localStorage.getItem(LEDGER_KEY)||'{}'); }catch{ return {}; } }
  function setLedger(obj){ localStorage.setItem(LEDGER_KEY, JSON.stringify(obj||{})); }
  function addPoints(uid, delta){
    const l=getLedger();
    const next = Math.max(0, Number(l[uid]||0) + Number(delta||0));
    l[uid] = next;
    setLedger(l);
  }

  /* ===== 本機暫存留言（refresh 後也看得到）===== */
  const PENDING_KEY = pid => `pendingComments:${pid}`;
  function loadPending(){ try{ return JSON.parse(localStorage.getItem(PENDING_KEY(postId)) || '[]'); }catch{ return []; } }
  function savePending(list){ localStorage.setItem(PENDING_KEY(postId), JSON.stringify(list.slice(0,50))); }
  function addPending(c){ const list = loadPending(); list.unshift(c); savePending(list); }
  function removePendingIfSynced(server){
    const list=loadPending(); if(!list.length) return;
    const after=list.filter(pc=>{
      const matched = server.some(sc => (pc.content && sc.content===pc.content) || (pc.tempId && String(sc._id||sc.id)===String(pc.tempId)));
      return !matched;
    });
    if(after.length!==list.length) savePending(after);
  }

  /* ===== 文章 & 權限 ===== */
  let POST_AUTHOR_ID = null;
  function isPostAuthor(){ return POST_AUTHOR_ID && currentUserId() && POST_AUTHOR_ID === currentUserId(); }
  async function loadPost(){
    const res = await fetch(`${API}/posts/${encodeURIComponent(postId)}`);
    if(!res.ok) throw new Error('讀文章失敗');
    const p = await res.json();
    POST_AUTHOR_ID = String(p.author?._id || p.author || '');
    document.getElementById('pTitle').textContent = p.title || '(無標題)';
    document.getElementById('pMeta').textContent = `${p.author?.username||p.authorName||'匿名'} · ${timeAgo(p.createdAt)}`;
    document.getElementById('pContent').textContent = p.content||'';
  }

  /* ===== 讀留言（/comments/post/:postId → 404 fallback ?postId=...）===== */
  async function fetchComments(){
    try{
      let res = await fetch(`${API}/comments/post/${encodeURIComponent(postId)}`, { headers: authHeaders() });
      if(res.ok){ const d = await res.json(); return Array.isArray(d.comments)?d.comments:d; }
      if(res.status===404){
        res = await fetch(`${API}/comments?postId=${encodeURIComponent(postId)}`, { headers: authHeaders() });
        if(res.ok){ const d = await res.json(); return Array.isArray(d.comments)?d.comments:d; }
      }
      return [];
    }catch{ return []; }
  }

  /* ===== Best/Like API ===== */
  async function setBest(id){
    const r = await fetch(`${API}/comments/${encodeURIComponent(id)}/best`, { method:'PUT', headers:authHeaders() });
    if(!r.ok) throw new Error(); return r.json().catch(()=>({}));
  }
  async function likeRequest(id){
    const r = await fetch(`${API}/comments/${encodeURIComponent(id)}/like`, { method:'PUT', headers:authHeaders() });
    if(!r.ok) throw new Error(); return r.json().catch(()=>({}));
  }

  /* ===== replyId：同時考慮伺服器 + 本機 ===== */
  async function getNextReplyId(){
    try{
      const [server, pending] = await Promise.all([fetchComments().catch(()=>[]), Promise.resolve(loadPending())]);
      let max=0; [...server, ...pending].forEach(c=>{ const v=Number(c.replyId); if(!Number.isNaN(v)&&v>max) max=v; });
      const fallback = (server.length||0) + (pending.length||0);
      return (max || fallback) + 1;
    }catch{ return (loadPending().length||0)+1; }
  }

  /* ===== 留言作者判定 ===== */
  function getCommentAuthorId(c){
    const a = c.author;
    if (!a) return String(c.authorId || c.userId || '');
    if (typeof a === 'string') return String(a);
    return String(a._id || a.id || a.userId || '');
  }

  /* ===== 渲染留言（把「去商店使用」改為真正的按讚）===== */
  function iLikedThis(c){
    const me=currentUserId(); if(!me) return false;
    if(Array.isArray(c.likedBy)) return c.likedBy.some(x=>String(x._id||x.id||x)===me);
    return false;
  }

  function renderComment(c, {pending=false, indexForDisplay=null}={}){
    const div=document.createElement('div');
    const cid=String(c._id||c.id||'');
    const likes=Number(c.numOfLikes ?? c.likes ?? (Array.isArray(c.likedBy)?c.likedBy.length:0) ?? 0);
    const isBest=Boolean(c.bestReply===true);
    const cutoff=c.cutoffTime||c.cutofftime||c.cutoff||null;
    const replyNo=(typeof c.replyId==='number'?c.replyId:indexForDisplay);
    const liked=iLikedThis(c);
    const receiverId = getCommentAuthorId(c);
    const receiverName = c.author?.username || c.authorName || '匿名';

    div.className='cmt'+(pending?' pending':'')+(isBest?' best':'');
    div.innerHTML=`
      <div class="top">
        <span class="badge gray">#${replyNo ?? '—'}</span>
        <span class="name">${escapeHtml(receiverName)}</span>
        ${isBest ? `<span class="badge">最佳留言</span>` : ''}
        <span>· ${timeAgo(c.createdAt)}</span>
        ${cutoff ? `<span class="meta">（截止：${escapeHtml(fmt(cutoff))}）</span>` : ''}
      </div>
      <div class="txt">${escapeHtml(c.content || '')}</div>
      <div class="actions">
        <span>讚數：<b id="lk-${cid}">${likes}</b></span>
        ${(!pending && cid) ? `<button class="btn like-btn ${liked?'active':''}" data-like="${cid}" data-author="${receiverId}">👍 ${liked?'已讚':'按讚/取消'}</button>` : ''}
        ${(!pending && cid && isPostAuthor()) ? `<button class="btn" data-best="${cid}">${isBest ? '取消最佳' : '設為最佳'}</button>` : ''}
      </div>
    `;

    /* like：成功後切換外觀、更新數字，並給留言作者 ±50 分 */
    if (!pending && cid) {
      const btn = div.querySelector(`[data-like="${cid}"]`);
      btn?.addEventListener('click', async (ev)=>{
        if(!localStorage.getItem('token') && !localStorage.getItem('authToken')){ location.href='login2.html'; return; }
        const b=ev.currentTarget; b.disabled=true;
        try{
          const data = await likeRequest(cid);
          const after = Number(data.likes ?? data.numOfLikes ?? document.getElementById(`lk-${cid}`)?.textContent ?? likes);
          const nEl = document.getElementById(`lk-${cid}`); if(nEl) nEl.textContent = after;

          const nowLiked = !b.classList.contains('active');
          b.classList.toggle('active');
          b.textContent = '👍 ' + (b.classList.contains('active') ? '已讚' : '按讚/取消');

          const targetUser = b.getAttribute('data-author');
          if (targetUser) addPoints(targetUser, nowLiked ? 50 : -50); // ★ 按讚=+50，取消=-50
        }catch(e){ console.warn('like 失敗：', e); } finally{ b.disabled=false; }
      });
    }

    /* best（只有文章作者） */
    if (!pending && cid && isPostAuthor()) {
      const btn = div.querySelector(`[data-best="${cid}"]`);
      btn?.addEventListener('click', async (ev)=>{
        if(!localStorage.getItem('token') && !localStorage.getItem('authToken')){ location.href='login2.html'; return; }
        const b=ev.currentTarget; b.disabled=true;
        try{ await setBest(cid); await loadComments(); }catch(e){ console.warn('setBest 失敗：', e); } finally{ b.disabled=false; }
      });
    }

    return div;
  }

  /* ===== 載入留言（含顯示用 replyId 連號）===== */
  async function loadComments(){
    const list=document.getElementById('cList'), empty=document.getElementById('cEmpty');
    list.innerHTML=''; empty.style.display='none';

    // 先顯示本機暫存
    const pending=loadPending();
    pending.forEach((p,i)=> list.appendChild(renderComment(p,{pending:true,indexForDisplay:`p${pending.length-i}`})));

    // 再顯示後端
    const server=await fetchComments();
    if(!pending.length && !server.length){ empty.style.display=''; return; }

    server.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
    // 對沒有 replyId 的留言發配不重複連號
    const used=new Set(); server.forEach(sc=>{ if(Number.isFinite(Number(sc.replyId))) used.add(Number(sc.replyId)); });
    let cursor=1;
    server.forEach(sc=>{
      let no=Number.isFinite(Number(sc.replyId))?Number(sc.replyId):null;
      if(no==null){ while(used.has(cursor)) cursor++; no=cursor; used.add(no); cursor++; }
      list.appendChild(renderComment(sc,{indexForDisplay:no}));
    });

    if(server.length) removePendingIfSynced(server);
  }

  /* ===== 對齊：最多 5 次、每次 600ms ===== */
  async function reconcileAfterPost(insertedContent){
    for (let i=0;i<5;i++){
      await new Promise(r=>setTimeout(r,600));
      const cmts=await fetchComments();
      const found=cmts.some(sc=>sc && sc.content===insertedContent);
      if(found){ savePending(loadPending().filter(p=>p.content!==insertedContent)); await loadComments(); return; }
    }
  }

  /* ===== 新增留言：送 cutoffTime + replyId ===== */
  function defaultCutoffISO(){ const d=new Date(Date.now()+7*24*60*60*1000); const pad=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  function toISOFromLocalInput(v){ if(!v) return null; try{ return new Date(v).toISOString(); }catch{ return null; } }

  async function addComment_legacy(){
    const ta=document.getElementById('cContent');
    const status=document.getElementById('cStatus');
    const cutoffV=document.getElementById('cutoffInput').value;
    const txt=ta.value.trim();
    if(!txt){ status.textContent='請輸入內容'; status.className='warn'; return; }

    const nextReplyId = await getNextReplyId();

    const u=getCurrentUser();
    const pendingItem={
      tempId:'tmp_'+Date.now(), postId,
      authorName:u.username||u.name||'我',
      content:txt, createdAt:new Date().toISOString(),
      cutoffTime:toISOFromLocalInput(cutoffV),
      replyId: nextReplyId
    };
    addPending(pendingItem);
    document.getElementById('cEmpty').style.display='none';
    document.getElementById('cList').prepend(renderComment(pendingItem,{pending:true,indexForDisplay:nextReplyId}));

    status.textContent='送出中…'; status.className='meta'; ta.value='';
    try{
      const res=await fetch(`${API}/comments`,{
        method:'POST', headers:authHeaders(),
        body:JSON.stringify({ postId, content:txt, cutoffTime:toISOFromLocalInput(cutoffV), replyId: nextReplyId })
      });
      if(!res.ok){
        status.textContent=(res.status===401||res.status===403)?'請先登入再留言':'送出失敗（已暫存於本機）';
        status.className='warn'; return;
      }
      status.textContent='已送出！'; setTimeout(()=>{ status.textContent=''; }, 900);
      reconcileAfterPost(txt);
    }catch{
      status.textContent='網路異常（已暫存於本機）'; status.className='warn';
    }
  }

  //document.getElementById('btnAdd').addEventListener('click', addComment);
  (function initCutoff(){ document.getElementById('cutoffInput').value = defaultCutoffISO(); })();
  (async function init(){ if(!postId){ alert('缺少文章ID'); location.href='post.html'; return; } refreshUserBadge(); await loadPost(); await loadComments(); setInterval(loadComments, 10000); })();
</script>

<!-- ethers 載過就不用重複；沒載過就保留這行 -->
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

<script type="module">
  import { initPost } from './js/chain/module/post.js';

  // ===== 基本設定 =====
  const API_URL =
    (typeof window.API === 'string' && window.API) ? window.API :
    ((window.API_BASE || 'http://localhost:3000') + '/api');

  const POST_CID = window.postId || new URLSearchParams(location.search).get('id');

  // ===== 小工具 =====
  const setStatus = (msg, ok=false)=>{
    const el = document.getElementById('cStatus');
    if (!el) return;
    el.textContent = msg || '';
    el.className = ok ? 'meta' : (msg ? 'warn' : 'meta');
  };

  const getIface    = (x)=> (x?.interface || x?.contract?.interface || x?.abi || null);
  const getContract = (x)=> (x?.instance ? x.instance() : (x?.contract || x));

  async function logTx(label, txp){
    const tx = await txp;
    console.groupCollapsed(`🧾 ${label} sent`); console.log('hash:', tx.hash); console.groupEnd();
    const rc = await tx.wait();
    console.groupCollapsed(`✅ ${label} mined`); console.log('block:', rc.blockNumber); console.groupEnd();
    return rc;
  }

  async function getPostContract(){
    if (!window.ethereum) throw new Error('找不到錢包（window.ethereum）');
    const provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send('eth_requestAccounts', []);
    let net = await provider.getNetwork();
    if (+net.chainId !== 31337){
      await window.ethereum.request({ method:'wallet_switchEthereumChain', params:[{ chainId:'0x7a69' }] });
    }
    const addrs = await fetch('./js/chain/addresses.json').then(r=>r.json());
    const code  = await provider.getCode(addrs.PostManager);
    if (!code || code === '0x') throw new Error('PostManager 未部署或位址錯誤；請重佈署並更新 addresses.json');
    const post  = await initPost({ provider, signer: provider.getSigner(), address: addrs.PostManager });
    const c     = getContract(post);
    const iface = getIface(c);
    return { provider, contract: c, iface };
  }

  // 找函式（大小寫不敏感）
  function findFn(iface, preferList){
    const keys = Object.keys(iface?.functions || {});
    const lower = keys.map(k=>[k, k.toLowerCase()]);
    for (const want of preferList){
      const idx = lower.findIndex(([k,kl])=> kl === want.toLowerCase());
      if (idx >= 0) return keys[idx];
    }
    return null;
  }

  // ===== 新增留言主流程（DB → 鏈上）=====
  window.addComment = async function addComment(){
    if (window.__addingComment) return;
    window.__addingComment = true;
    const btn = document.getElementById('btnAdd');
    btn && (btn.disabled = true);

    const ta  = document.getElementById('cContent');
    const txt = (ta?.value || '').trim();
    const cutoffV = document.getElementById('cutoffInput')?.value || '';
    if (!txt){ setStatus('請輸入內容'); window.__addingComment=false; btn&&(btn.disabled=false); return; }

    // 樂觀 UI（沿用你頁面已定義的工具）
    const nextReplyId = await (window.getNextReplyId?.().catch?.(()=>1) ?? Promise.resolve(1));
    const u = (window.getCurrentUser?.() || {});
    const pendingItem = {
      tempId:'tmp_'+Date.now(), postId: POST_CID,
      authorName: u.username || u.name || '我',
      content: txt, createdAt: new Date().toISOString(),
      cutoffTime: (cutoffV ? new Date(cutoffV).toISOString() : null),
      replyId: nextReplyId
    };
    window.addPending?.(pendingItem);
    document.getElementById('cEmpty') && (document.getElementById('cEmpty').style.display='none');
    window.renderComment && document.getElementById('cList')?.prepend(
      window.renderComment(pendingItem, { pending:true, indexForDisplay: nextReplyId })
    );

    setStatus('送出中…'); ta && (ta.value='');

    try{
      // 1) 後端建立留言（帶 cutoff 與 replyId）
      const res = await fetch(`${API_URL}/comments`, {
        method:'POST',
        headers:(window.authHeaders?.() || { 'Content-Type':'application/json' }),
        body: JSON.stringify({ postId: POST_CID, content: txt, cutoffTime: (cutoffV?new Date(cutoffV).toISOString():null), replyId: nextReplyId })
      });
      let data=null, text=''; try{ data=await res.clone().json(); }catch{} try{ text=await res.text(); }catch{}
      let commentCID = data?._id || data?.comment?._id || data?.result?._id;

      // 後援：回查同文留言列表，找內容一致那筆
      if (!res.ok || !commentCID){
        const r2 = await fetch(`${API_URL}/comments/post/${encodeURIComponent(POST_CID)}`, { headers: window.authHeaders?.() || {} });
        if (r2.ok){
          const j = await r2.json().catch(()=>({comments:[]}));
          const arr = Array.isArray(j?.comments) ? j.comments : (Array.isArray(j)?j:[]);
          const me  = String((window.currentUserId?.() || ''));
          const f   = arr.find(c => c && c.content===txt && String(window.getCommentAuthorId?.(c) || c.authorId || '')===me);
          if (f) commentCID = f._id || f.id;
        }
      }
      if (!commentCID) throw new Error(data?.message || text || '建立留言失敗');

      // 2) 鏈上：優先使用 ReplyPostByCID(string,string) → 次選 ReplyPostByID(uint256,string)
      setStatus('鏈上寫入中…');
      const { contract, iface } = await getPostContract();

      // 找函式
      const sigByCID = findFn(iface, ['replypostbycid(string,string)']);
      const sigByID  = findFn(iface, ['replypostbyid(uint256,string)']);
      const sigView  = findFn(iface, ['getcidtopostid(string)']); // 你的 view

      if (sigByCID){
        // 直接吃兩個 CID
        await logTx('ReplyPostByCID', contract[sigByCID](String(POST_CID), String(commentCID)));
      } else if (sigByID && sigView){
        // 查 postId → 以 postId 回文
        const idBN = await contract[sigView](String(POST_CID)); // 不存在會在合約端 revert
        const id   = ethers.BigNumber.from(idBN).toString();
        await logTx('ReplyPostByID', contract[sigByID](id, String(commentCID)));
      } else {
        throw new Error('合約缺少 ReplyPostByCID/ReplyPostByID 或 ABI 未更新，請重新編譯並更新前端 ABI。');
      }

      setStatus('已送出！', true);
      setTimeout(()=> setStatus(''), 900);
      window.reconcileAfterPost && (await window.reconcileAfterPost(txt));
    }catch(e){
      const msg = (e?.error?.message || e?.message || '').toLowerCase();
      if (msg.includes('post dose not exist') || msg.includes('post does not exist') || msg.includes('post not found')){
        setStatus('鏈上找不到這篇貼文（可能 mapping 尚未寫入或 ABI 未更新）。請稍後重試。');
      }else{
        setStatus(e.message || '送出失敗（已暫存於本機）');
      }
      console.error(e);
    }finally{
      window.__addingComment=false;
      btn && (btn.disabled=false);
    }
  };

  // 只綁一次按鈕（移除舊監聽）
  {
    const oldBtn = document.getElementById('btnAdd');
    if (oldBtn){
      const nb = oldBtn.cloneNode(true);
      oldBtn.parentNode.replaceChild(nb, oldBtn);
      nb.addEventListener('click', window.addComment);
    }
  }
</script>
