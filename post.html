<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<title>文章清單</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  :root{
    --bg:#0b0f19; --card:#121826; --card-2:#0f172a;
    --muted:#9aa4b2; --text:#e5e7eb; --border:#1f2937;
    --shadow:0 10px 30px rgba(0,0,0,.35); --radius:14px;
    --primary:#4caf50; --primary-hover:#45a049;
    --danger:#ef4444; --danger-hover:#dc2626; --accent:#3b82f6;
  }
  *{box-sizing:border-box}
  body{
    font-family:Arial,"Microsoft JhengHei",sans-serif; margin:0; min-height:100vh; color:var(--text);
    background: radial-gradient(1200px 600px at 20% -10%, #12233f 0%, transparent 60%),
                radial-gradient(900px 600px at 100% 0%, #1a2638 0%, transparent 60%), var(--bg);
  }
  .nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:16px 20px;
       background:rgba(9,12,20,.65);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
  .nav h1{font-size:20px;margin:0}
  .nav .spacer{flex:1}
  .btn{padding:10px 14px;border:none;border-radius:10px;background:var(--card-2);color:var(--text);
       cursor:pointer;border:1px solid #273041;transition:background .15s ease,transform .05s ease}
  .btn:active{transform:translateY(1px)}
  .btn.linklike{background:transparent;border-color:transparent;color:#93c5fd}
  .btn.linklike:hover{text-decoration:underline}
  /* 新增：發文主色按鈕 */
  .btn.primary{background:var(--primary);border-color:transparent}
  .btn.primary:hover{background:var(--primary-hover)}
  .wrap{max-width:980px;margin:24px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .list{padding:12px}
  .post{padding:16px;border:1px solid #273041;border-radius:12px;background:#0f172a}
  .post + .post{margin-top:12px}
  .title{font-size:18px;margin:0 0 6px}
  .meta{font-size:13px;color:#cbd5e1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .excerpt{color:#e2e8f0;margin:8px 0 0}
  .empty{text-align:center;padding:28px;color:var(--muted)}
  a{color:#93c5fd;text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="nav">
    <h1>文章清單</h1>
    <span id="userBadge" class="btn linklike" style="cursor:default"></span>
    <div class="spacer"></div>
    <!-- 新增：發文按鈕 -->
    <button class="btn primary" onclick="location.href='create_post.html'">＋ 發文</button>
    <button class="btn linklike" onclick="location.href='store.html'">前往商店</button>
    <button class="btn" onclick="location.href='login2.html'">重新登入</button>
    <button class="btn" onclick="logout()">登出</button>
  </div>

  <div class="wrap">
    <div class="card">
      <div id="list" class="list"></div>
      <div id="empty" class="empty" style="display:none;">目前尚無貼文。</div>
    </div>
  </div>

<script>
  // === 使用者顯示（沿用 localStorage 結構） ===
  function displayRole(r){
    const s = String(r||'').trim().toLowerCase();
    if(['mentor','teacher','老師','教師'].includes(s)) return '老師';
    if(['student','學生'].includes(s)) return '學生';
    return '訪客';
  }
  const user = (()=>{ try{
    const u = JSON.parse(localStorage.getItem('user')||'{}');
    return {name: u.username||u.name||'使用者', role: u.role||'學生'};
  }catch{ return {name:'使用者', role:'學生'} }})();
  document.getElementById('userBadge').textContent = `${user.name}（${displayRole(user.role)}）`;

  function logout(){
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    location.href='login2.html';
  }

  function timeAgo(iso){
    if(!iso) return '';
    const diff=(Date.now()-new Date(iso).getTime())/1000;
    if(diff<60) return `${Math.floor(diff)} 秒前`;
    if(diff<3600) return `${Math.floor(diff/60)} 分鐘前`;
    if(diff<86400) return `${Math.floor(diff/3600)} 小時前`;
    return `${Math.floor(diff/86400)} 天前`;
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  async function loadPosts(){
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    list.innerHTML = '';
    empty.style.display = 'none';

    try{
      // 讀取所有文章：GET /api/posts
      const res = await fetch('http://localhost:3000/api/posts');
      if(!res.ok) throw new Error('無法取得文章清單');
      const posts = await res.json();

      if(!posts || posts.length===0){
        empty.style.display = '';
        return;
      }

      posts
        .sort((a,b)=> new Date(b.createdAt||b._createdAt||b.updatedAt||0) - new Date(a.createdAt||a._createdAt||a.updatedAt||0))
        .forEach(p=>{
          const id = p._id || p.id;
          const div = document.createElement('div');
          div.className = 'post';
          div.innerHTML = `
            <h3 class="title"><a href="comment.html?id=${encodeURIComponent(id)}">${escapeHtml(p.title||'(無標題)')}</a></h3>
            <div class="meta">
              <span>${escapeHtml(p.authorName || p.author || '匿名')}</span>
              <span>·</span>
              <span>${timeAgo(p.createdAt)}</span>
            </div>
            <p class="excerpt">${escapeHtml((p.content||'').slice(0,120))}${(p.content && p.content.length>120)?'…':''}</p>
          `;
          list.appendChild(div);
        });
    }catch(err){
      list.innerHTML = `<div class="empty">讀取失敗：${escapeHtml(err.message)}</div>`;
    }
  }

  loadPosts();
</script>
</body>
</html>
