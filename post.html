<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<title>文章列表</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  :root{--bg:#0b0f19;--card:#121826;--card2:#0f172a;--muted:#9aa4b2;--text:#e5e7eb;--border:#1f2937;--accent:#2563eb;--ok:#22c55e;--shadow:0 10px 30px rgba(0,0,0,.35);--r:14px}
  *{box-sizing:border-box} body{margin:0;color:var(--text);font-family:Arial,"Microsoft JhengHei",sans-serif;background:
    radial-gradient(1200px 600px at 20% -10%,#12233f 0%,transparent 60%),
    radial-gradient(900px 600px at 100% 0%,#1a2638 0%,transparent 60%),var(--bg)}
  .nav{position:sticky;top:0;display:flex;gap:10px;align-items:center;padding:14px 16px;background:rgba(9,12,20,.65);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);z-index:5}
  .nav h1{font-size:18px;margin:0}.sp{flex:1}
  .btn{padding:8px 12px;border:1px solid var(--border);background:var(--card2);color:var(--text);border-radius:10px;cursor:pointer}
  .btn.primary{background:var(--ok);border-color:transparent}
  .wrap{max-width:980px;margin:20px auto;padding:0 16px}
  .grid{display:grid;gap:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
  .title{font-size:18px;margin:0 0 6px}
  .title a{color:#e5e7eb;text-decoration:none} .title a:hover{text-decoration:underline}
  .meta{font-size:12px;color:#cbd5e1}
  input,textarea{background:#0f172a;color:#e5e7eb;border:1px solid #273041;border-radius:8px;padding:8px}
</style>
</head>
<body>
  <div class="nav">
    <h1>文章列表</h1>
    <div class="sp"></div>
    <span id="userBadge" class="meta">未登入</span>
    <button class="btn" onclick="location.href='store.html'">🛍 商店</button>
    <button class="btn" id="btnLogin" onclick="location.href='login2.html'">登入</button>
    <button class="btn" id="btnLogout" style="display:none" onclick="logout()">登出</button>
  </div>

  <div class="wrap">
    <div class="card">
      <h3 style="margin:0 0 10px">✏️ 建立文章</h3>
      <div style="display:grid;gap:8px">
        <input id="pTitle" placeholder="標題"/>
        <textarea id="pContent" rows="3" placeholder="內容"></textarea>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn primary" id="btnCreate">建立文章</button>
          <span id="pStatus" class="meta"></span>
        </div>
      </div>
    </div>

    <div class="grid" id="list"></div>
    <div id="empty" class="meta" style="padding:12px;display:none">目前沒有文章。</div>
  </div>

<script>
  const API = 'http://localhost:3000/api';

  function authHeaders(){
    const t = localStorage.getItem('token') || localStorage.getItem('authToken');
    return t ? {'Content-Type':'application/json','Authorization':'Bearer '+t} : {'Content-Type':'application/json'};
  }
  function getUser(){ try{return JSON.parse(localStorage.getItem('user')||'{}')}catch{return{}} }
  function refreshUserBadge(){
    const u=getUser(); const has=!!(localStorage.getItem('token')||localStorage.getItem('authToken'));
    document.getElementById('userBadge').textContent = has? `👤 ${u.username||u.name||'使用者'}` : '未登入';
    document.getElementById('btnLogin').style.display = has?'none':''; 
    document.getElementById('btnLogout').style.display = has?'':'none';
  }
  function logout(){ localStorage.removeItem('token'); localStorage.removeItem('authToken'); localStorage.removeItem('user'); refreshUserBadge(); }

  function timeAgo(iso){const d=(Date.now()-new Date(iso))/1000; if(d<60)return`${d|0} 秒前`; if(d<3600)return`${(d/60)|0} 分前`; if(d<86400)return`${(d/3600)|0} 小時前`; return`${(d/86400)|0} 天前`; }
  function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

  async function fetchPosts(){
    try{
      const r = await fetch(`${API}/posts`, {headers:authHeaders()});
      if(!r.ok) return [];
      const d = await r.json();
      return Array.isArray(d.posts)?d.posts:d;
    }catch{ return []; }
  }

  function renderPost(p){
    const pid = esc(p._id||p.id);
    const el = document.createElement('div');
    el.className='card';
    el.innerHTML = `
      <h3 class="title"><a href="comment.html?id=${pid}">${esc(p.title||'(無標題)')}</a></h3>
      <div class="meta">${esc(p.author?.username || p.authorName || '匿名')} · ${timeAgo(p.createdAt)}</div>
      <div class="meta" style="margin-top:6px;color:#9aa4b2">${esc(String(p.content||'').slice(0,120))}${String(p.content||'').length>120?'…':''}</div>
    `;
    return el;
  }

  async function loadList(){
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    list.innerHTML=''; empty.style.display='none';
    const items = (await fetchPosts()).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    if(!items.length){ empty.style.display=''; return; }
    items.forEach(p=> list.appendChild(renderPost(p)));
  }

  document.getElementById('btnCreate').onclick = async ()=>{
    const title=document.getElementById('pTitle').value.trim();
    const content=document.getElementById('pContent').value.trim();
    const st=document.getElementById('pStatus');
    if(!title){ st.textContent='請輸入標題'; return; }
    st.textContent='送出中…';
    try{
      const r = await fetch(`${API}/posts`, {method:'POST', headers:authHeaders(), body:JSON.stringify({title,content})});
      if(!r.ok){ st.textContent = (r.status===401||r.status===403)?'請先登入':'建立失敗'; return; }
      document.getElementById('pTitle').value=''; document.getElementById('pContent').value='';
      st.textContent='已建立'; setTimeout(()=>st.textContent='',900);
      await loadList();
    }catch{ st.textContent='網路異常'; }
  };

  (async function init(){ refreshUserBadge(); await loadList(); })();
</script>
</body>
</html>
