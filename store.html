<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<title>商店 / 點數兌換</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  :root{--bg:#0b0f19;--card:#121826;--card-2:#0f172a;--muted:#9aa4b2;--text:#e5e7eb;--border:#1f2937;--shadow:0 10px 30px rgba(0,0,0,.35);--radius:14px;--primary:#4caf50;--primary-hover:#45a049;--accent:#3b82f6}
  *{box-sizing:border-box}
  body{font-family:Arial,"Microsoft JhengHei",sans-serif;margin:0;min-height:100vh;color:var(--text);
       background:radial-gradient(1200px 600px at 20% -10%,#12233f 0%,transparent 60%),radial-gradient(900px 600px at 100% 0%,#1a2638 0%,transparent 60%),var(--bg)}
  .nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:16px 20px;background:rgba(9,12,20,.65);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
  .nav h1{font-size:20px;margin:0}.nav .spacer{flex:1}
  .btn{padding:10px 14px;border:1px solid #273041;border-radius:10px;background:var(--card-2);color:var(--text);cursor:pointer;transition:background .15s ease,transform .05s ease}
  .btn:active{transform:translateY(1px)} .btn.primary{background:var(--primary);border-color:transparent}
  .btn.primary:hover{background:var(--primary-hover)} .btn.link{background:transparent;border-color:transparent;color:#93c5fd}
  .btn.link:hover{text-decoration:underline}
  .wrap{max-width:980px;margin:24px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .balance{padding:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .item{padding:16px}
  .item h3{margin:0 0 6px;font-size:18px}
  .muted{color:var(--muted);font-size:14px}
  .price{font-weight:700}
  .status-text { margin-left: 10px; font-weight: bold; }
  .out-of-stock { color: #fca5a5; }
</style>
</head>
<body>
  <div class="nav">
    <h1>商店 / 點數兌換</h1>
    <div class="spacer"></div>
    <button class="btn link" onclick="location.href='post.html'">← 返回文章清單</button>
    <button class="btn" onclick="logout()">登出</button>
  </div>

  <div class="wrap">
    <div class="card balance">
      <div>目前點數餘額：<b id="bal">--</b></div>
      <button class="btn" onclick="refreshBalance()">刷新</button>
      <span id="authStatus" class="status-text"></span>
    </div>

    <div class="grid" id="storeGrid"></div>
  </div>

<script>
  const API_BASE = 'http://localhost:3000/api';
  const LEDGER_KEY='pointsLedger'; //存point

  /* --- 身份驗證與工具 --- */
  function getAuthHeaders(){ 
    const t=localStorage.getItem('token')||localStorage.getItem('authToken'); 
    if (!t) return {};
    return {'Content-Type':'application/json','Authorization':'Bearer '+t}; 
  }
  function getUser(){try{return JSON.parse(localStorage.getItem('user')||'{}')}catch{return{}}}
  function currentUserId(){const u=getUser();return String(u._id||u.id||u.walletId||'')}
  function logout(){localStorage.removeItem('token');localStorage.removeItem('user');location.href='login2.html'}

  /* --- 點數操作 (使用 LocalStorage 模擬) --- */
  function getLedger(){try{return JSON.parse(localStorage.getItem(LEDGER_KEY)||'{}')}catch{return{}}}
  function setLedger(o){localStorage.setItem(LEDGER_KEY,JSON.stringify(o||{}))}
  function getBalance(){const l=getLedger();return Number(l[currentUserId()]||0)}
  function addPoints(delta){const l=getLedger();const id=currentUserId();l[id]=(Number(l[id]||0)+Number(delta||0))|0;setLedger(l)}
  
  async function refreshBalance(){
    // 這裡只是刷新前端模擬點數，沒有打後端 API 讀取用戶點數
    document.getElementById('bal').textContent=getBalance();
  }

  /* --- API 互動邏輯 --- */

  // 靜態模擬數據：用於後端 API 連線失敗時
  const MOCK_REWARDS = [
      { _id: 'mock1', name: '期末成績加 5 分', description: '適用所有科目', type: 'grade', pointsRequired: 500, userLimit: 1, quantity: 999 },
      { _id: 'mock2', name: '星巴克禮券 $100', description: '實體禮券，限兌換一次', type: 'physical', pointsRequired: 1500, userLimit: 1, quantity: 3 },
      { _id: 'mock3', name: '數位學習資源包', description: '2025 年最新資料', type: 'digital', pointsRequired: 300, userLimit: 0, quantity: 999 },
      { _id: 'mock4', name: '限量紀念 T-shirt (L)', description: '已無庫存，無法兌換', type: 'physical', pointsRequired: 2000, userLimit: 1, quantity: 0 },
  ];

  async function fetchRewards(){
    const authStatus = document.getElementById('authStatus');
    authStatus.textContent = '';
    
    // 檢查登入狀態
    if (!currentUserId()) {
      authStatus.textContent = '⚠️ 請先登入';
      return [];
    }
    
    try {
      // 嘗試呼叫後端 API
      const res = await fetch(`${API_BASE}/rewards`, { headers: getAuthHeaders() });
      
      if (res.status === 404) {
        // 如果遇到 404，僅在 Console 警告，不顯示在 UI 上
        console.warn('Backend API /api/rewards returned 404. Falling back to mock data.');
        return MOCK_REWARDS;
      }

      if (!res.ok) {
        // 其他非 2xx 錯誤 (如 401, 500)
        if (res.status === 401) {
             authStatus.textContent = '⚠️ 驗證失敗，請重新登入';
             return [];
        }
        console.warn(`Error (HTTP ${res.status}), falling back to mock data.`);
        return MOCK_REWARDS;
      }
      
      // API 成功，使用後端數據
      const data = await res.json();
      return data;
    } catch (e) {
      // 網路連線錯誤 (例如 CORS, ECONNREFUSED)
      console.error('Fetch rewards error (API failed):', e);
      // 網路連線錯誤不顯示在 UI 上
      return MOCK_REWARDS;
    }
  }

  async function redeemItem(rewardId, cost) {
    if (!currentUserId()) {
      alert('請先登入才能進行兌換。');
      return;
    }
    
    // 前端點數模擬檢查
    if (getBalance() < cost) {
      alert('點數不足，無法兌換！');
      return;
    }

    if (!confirm(`確定要花 ${cost} 點兌換此商品嗎？`)) {
        return;
    }

    try {
      // 呼叫後端兌換 API
      const res = await fetch(`${API_BASE}/rewards/${rewardId}/redeem`, {
        method: 'POST',
        headers: getAuthHeaders(),
      });
      
      const data = await res.json().catch(() => ({}));

      // *** 核心模擬邏輯：即使 API 失敗 (404/500/連線錯誤)，只要不是明確的後端錯誤，就假設兌換成功 ***
      
      // 判斷是否為「可接受的失敗」（404/連線失敗，但我們想要模擬成功）
      if (!res.ok && res.status !== 404) {
        // 處理後端明確的失敗訊息 (例如 400 庫存/點數不足)
        alert(`兌換失敗: ${data.message || '連線錯誤'}`);
        return;
      }

      // 如果成功 (res.ok) 或遇到 404/連線失敗，我們執行模擬成功邏輯
      
      // 扣除前端模擬點數並刷新 UI
      addPoints(-cost); 
      refreshBalance();
      
      alert(`✅ 兌換成功！已扣除 ${cost} 點。`);
      
      // 模擬庫存更新
      const itemIndex = MOCK_REWARDS.findIndex(item => item._id === rewardId);
      if (itemIndex !== -1 && MOCK_REWARDS[itemIndex].type !== 'grade') {
          MOCK_REWARDS[itemIndex].quantity = Math.max(0, MOCK_REWARDS[itemIndex].quantity - 1);
          console.log(`[Mock Update] Item ${rewardId} quantity reduced.`);
      }

      // 重新渲染列表 (會再次呼叫 fetchRewards，獲取更新後的模擬數據)
      renderStore(await fetchRewards()); 


    } catch (e) {
      console.error('Redeem error:', e);
      // 在兌換 API 發生連線錯誤時，也執行模擬成功邏輯
      
      // 扣除前端模擬點數並刷新 UI
      addPoints(-cost); 
      refreshBalance();
      
      alert(`✅ 兌換成功！已扣除 ${cost} 點。（註：後端連線失敗，已模擬扣點）`);
      
      // 模擬庫存更新
      const itemIndex = MOCK_REWARDS.findIndex(item => item._id === rewardId);
      if (itemIndex !== -1 && MOCK_REWARDS[itemIndex].type !== 'grade') {
          MOCK_REWARDS[itemIndex].quantity = Math.max(0, MOCK_REWARDS[itemIndex].quantity - 1);
          console.log(`[Mock Update] Item ${rewardId} quantity reduced.`);
      }
      renderStore(await fetchRewards());

    }
  }


  /* --- 渲染邏輯 --- */

  function renderStore(items){
    const grid=document.getElementById('storeGrid'); 
    grid.innerHTML='';
    const currentBalance = getBalance();

    if (items.length === 0) {
        grid.innerHTML = '<div class="empty" style="grid-column: 1 / -1; text-align: center; padding: 50px;">目前沒有商品可供兌換。</div>';
        return;
    }

    items.forEach(it=>{
      const isGrade = it.type === 'grade';
      // 檢查是否還有庫存 (grade 類型視為無限)
      const isOutOfStock = !isGrade && Number(it.quantity) <= 0; 
      const canAfford = currentBalance >= it.pointsRequired;
      const btnDisabled = isOutOfStock || !canAfford || !currentUserId();

      const div=document.createElement('div'); div.className='card item';
      div.innerHTML=`
        <h3>${it.name}</h3>
        <div class="muted">${it.description||'無描述'}</div>
        <div style="margin-top:8px">
            價格：<span class="price" style="color:${canAfford?'var(--primary)':'#fca5a5'};">${it.pointsRequired}</span> 分
        </div>
        <div class="muted">
            ${isGrade ? '庫存：無限' : `庫存：<span class="${isOutOfStock ? 'out-of-stock' : ''}">${it.quantity}</span>`}
        </div>
        ${it.userLimit > 0 ? `<div class="muted">限制：${it.userLimit} 次/用戶</div>` : ''}

        <div style="margin-top:12px">
            <button class="btn primary" id="btn-${it._id}" ${btnDisabled ? 'disabled' : ''}>
                ${isOutOfStock ? '已售罄' : (btnDisabled && !currentUserId() ? '請先登入' : (btnDisabled && !canAfford ? '點數不足' : '兌換'))}
            </button>
        </div>
      `;
      
      if (!btnDisabled) {
        div.querySelector('button').addEventListener('click', ()=>{
          redeemItem(it._id, it.pointsRequired);
        });
      }
      grid.appendChild(div);
    });
  }

  /* --- 初始化 --- */
  (async function init(){
    // 初始化時，給予一些起始點數，以便測試兌換功能
    if (getBalance() === 0 && currentUserId()) {
        addPoints(2000); 
    }

    const rewardItems = await fetchRewards();
    renderStore(rewardItems);
    await refreshBalance();
  })();
</script>
</body>
</html>
