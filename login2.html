<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>登入系統</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    body {
      font-family: 'Arial';
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 80px;
      background-color: #f0f2f5;
    }
    #walletArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    input, select, button, a {
      margin-top: 10px;
      padding: 10px;
      font-size: 16px;
      width: 250px;
      box-sizing: border-box;
    }
    #status { margin-top: 12px; min-height: 20px; }
  </style>
</head>
<body>

<h1>登入系統</h1>

<!-- 角色選擇（學生 / 老師 都用同一套 MetaMask 登入） -->
<select id="roleSelect">
  <option value="student">學生</option>
  <option value="mentor">老師</option>
</select>

<!-- MetaMask 區塊（兩種角色共用） -->
<div id="walletArea">
  <input type="text" id="walletId" placeholder="MetaMask 錢包地址 (0x...)" readonly>
  <button type="button" id="btnConnect">🔌 連線 MetaMask</button>
</div>

<button type="button" id="btnLogin">🚪 登入帳號</button>
<a href="register2.html">未註冊？去註冊</a>

<p id="status"></p>

<script>
  let walletAddress = "";
  const ETH_ADDR_RE = /^0x[a-fA-F0-9]{40}$/;

  // 切換角色時清空狀態（錢包地址保留，避免頻繁重連）
  function changeRole() {
    document.getElementById("status").innerText = "";
  }

  async function connectWallet() {
    const statusEl = document.getElementById("status");
    if (!window.ethereum) {
      statusEl.innerText = "找不到 MetaMask，請先安裝擴充套件。";
      return;
    }
    try {
      const provider = new ethers.providers.Web3Provider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      const signer = provider.getSigner();
      walletAddress = await signer.getAddress();

      if (!ETH_ADDR_RE.test(walletAddress)) {
        document.getElementById("walletId").value = "";
        statusEl.innerText = "錢包地址格式不正確。";
        return;
      }
      document.getElementById("walletId").value = walletAddress;
      statusEl.innerText = "已連接 MetaMask。";
    } catch (err) {
      console.error(err);
      statusEl.innerText = "連接 MetaMask 失敗，請再試一次。";
    }
  }

  // 任一角色都同步 MetaMask 帳號變更
  if (window.ethereum) {
    window.ethereum.on("accountsChanged", (accounts) => {
      const statusEl = document.getElementById("status");
      if (accounts && accounts.length > 0) {
        walletAddress = accounts[0];
        document.getElementById("walletId").value = walletAddress;
        statusEl.innerText = "已切換 MetaMask 帳號。";
      } else {
        walletAddress = "";
        document.getElementById("walletId").value = "";
        statusEl.innerText = "MetaMask 未連接任何帳號。";
      }
    });
  }

  async function login() {
    const role = document.getElementById("roleSelect").value;
    const statusEl = document.getElementById("status");
    const walletId = (document.getElementById("walletId").value || "").trim();

    if (!walletId) {
      statusEl.innerText = "請先連接 MetaMask。";
      return;
    }
    if (!ETH_ADDR_RE.test(walletId)) {
      statusEl.innerText = "錢包地址格式不正確。";
      return;
    }

    const payload = { role, walletId };

    try {
      // 對齊你的 register：/api/users/*
      const res = await fetch("http://localhost:3000/api/users/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const result = await res.json().catch(() => ({}));
      if (res.ok) {
        statusEl.innerText = "✅ 登入成功！即將前往首頁…";
        setTimeout(() => {
          window.location.href = "discuss2.html";
        }, 1000);
      } else {
        statusEl.innerText = `❌ 登入失敗：${result.message || "請確認是否已註冊，或角色選擇是否正確"}`;
      }
    } catch (err) {
      console.error(err);
      statusEl.innerText = "⚠️ 無法連線到伺服器，請稍後再試。";
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    changeRole();
    document.getElementById("roleSelect").addEventListener("change", changeRole);
    document.getElementById("btnConnect").addEventListener("click", connectWallet);
    document.getElementById("btnLogin").addEventListener("click", login);
  });
</script>

</body>
</html>
