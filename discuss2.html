<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<title>討論區 - 公開版（含老師權限）</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
  :root{
    --bg:#0b0f19;
    --card:#121826;
    --card-2:#0f172a;
    --muted:#9aa4b2;
    --text:#e5e7eb;
    --border:#1f2937;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --radius:14px;
    --primary:#4caf50;
    --primary-hover:#45a049;
    --danger:#ef4444;
    --danger-hover:#dc2626;
    --accent:#3b82f6;
    --teacher:#0e1b35;
  }
  *{box-sizing:border-box}
  body{
    font-family:Arial,"Microsoft JhengHei",sans-serif;
    margin:0;
    min-height:100vh;
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 20% -10%, #12233f 0%, transparent 60%),
      radial-gradient(900px 600px at 100% 0%, #1a2638 0%, transparent 60%),
      var(--bg);
  }

  .nav{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:12px;
    padding:16px 20px;
    background:rgba(9,12,20,.65);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
  }
  .nav h1{font-size:20px; margin:0}
  .nav .spacer{flex:1}
  .btn{
    padding:10px 14px; border:none; border-radius:10px;
    background:var(--card-2); color:var(--text); cursor:pointer;
    border:1px solid #273041; transition:background .15s ease, transform .05s ease;
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--primary); border-color:transparent}
  .btn.primary:hover{background:var(--primary-hover)}
  .btn.danger{background:var(--danger); border-color:transparent}
  .btn.danger:hover{background:var(--danger-hover)}
  .btn.linklike{background:transparent; border-color:transparent; color:#93c5fd}
  .btn.linklike:hover{text-decoration:underline}

  .wrap{max-width:980px; margin:24px auto; padding:0 16px}
  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow)}
  #postForm{padding:20px}
  #postForm h3{margin:0 0 6px}
  .hint{font-size:12px; color:var(--muted); margin:4px 0 14px}
  .row{display:flex; gap:12px; flex-wrap:wrap}
  label{font-size:14px; color:#cbd5e1}
  input[type="text"], textarea{
    width:100%; padding:12px; margin-top:8px; margin-bottom:12px;
    border:1px solid #273041; border-radius:10px; outline:none;
    background:#0f172a; color:var(--text);
  }
  input::placeholder, textarea::placeholder{color:#64748b}
  input:focus, textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  .post{padding:18px}
  .post + .post{border-top:1px solid var(--border)}
  .post-title{font-size:18px; margin:0 0 6px}
  .meta{font-size:13px; color:#cbd5e1; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .badge{
    display:inline-block; padding:2px 8px; font-size:12px;
    border-radius:999px; background:#0c1324; border:1px solid #273041; color:#cbd5e1;
  }
  .badge.teacher{background:linear-gradient(180deg,var(--teacher),#0c1324); border-color:#1f3c78; color:#cfe1ff}
  .post-body{margin:10px 0 14px; line-height:1.6; color:#e2e8f0}
  .actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .reply-box{margin-top:10px; padding:12px; background:#0d1426; border:1px solid #273041; border-radius:12px}
  .reply-item{background:#0c1324; border:1px solid #273041; padding:10px 12px; border-radius:10px; margin-top:10px}
  .reply-item.teacher{background:linear-gradient(180deg,var(--teacher),#0c1324); border-color:#1f3c78}
  .reply-meta{font-size:12px; color:#93a0b3; margin-top:4px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .empty{text-align:center; padding:28px; color:var(--muted)}
  .footer-tip{margin-top:16px; padding:14px; font-size:13px; color:#cbd5e1; border-top:1px dashed #243044}
  @media (max-width:520px){.nav h1{font-size:18px}}
</style>
</head>
<body>

  <div class="nav">
    <h1>討論區</h1>
    <span class="badge" id="userBadge">訪客</span>
    <div class="spacer"></div>
    <button class="btn linklike" onclick="goStore()">前往商店</button>
    <!-- 移除：返回登入 -->
    <button class="btn danger" onclick="logout()">登出</button>
  </div>

  <div class="wrap">
    <div id="postForm" class="card">
      <h3>發表問題</h3>
      <div class="hint">已登入者會自動帶出使用者名稱與角色；未登入則以「匿名／訪客」發文。老師的回覆會顯示「老師」標記。</div>

      <label for="title">標題</label>
      <input id="title" type="text" placeholder="請輸入問題標題…"/>

      <label for="content">內容</label>
      <textarea id="content" rows="4" placeholder="請詳細描述你的問題或想法…"></textarea>

      <div class="row">
        <button class="btn primary" onclick="submitPost()">送出問題</button>
        <button class="btn" onclick="resetForm()">清空</button>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div id="posts"></div>
      <div id="emptyState" class="empty" style="display:none;">目前尚無貼文，搶先發一篇吧！</div>

      <div class="footer-tip">
        小提醒：本頁資料儲存在你的瀏覽器 <code>localStorage</code>，僅供前端展示與測試；正式版可串接後端 API。
      </div>
    </div>
  </div>

<script>
  // === 使用者狀態 ===
  let user = { name: "匿名", role: "訪客" };

  function normalizeRole(r){
    if(!r) return "";
    const s = String(r).trim().toLowerCase();
    if(["mentor","teacher","老師","教師"].includes(s)) return "mentor";
    if(["student","學生"].includes(s)) return "student";
    if(["visitor","guest","訪客"].includes(s)) return "guest";
    return s;
  }
  function displayRole(r){
    const n = normalizeRole(r);
    if(n === "mentor") return "老師";
    if(n === "student") return "學生";
    if(n === "guest") return "訪客";
    return r || "訪客";
  }

  try {
    const stored = localStorage.getItem("user");
    if (stored) {
      const u = JSON.parse(stored);
      user.name = u?.username || u?.name || "使用者";
      user.role = u?.role || "學生";
    }
  } catch (_) {}
  const isTeacher = normalizeRole(user.role) === "mentor";
  document.getElementById("userBadge").textContent = `${user.name}（${displayRole(user.role)}）`;

  function logout(){
    localStorage.removeItem("token");
    localStorage.removeItem("user");
    window.location.href = "login2.html";
  }
  function goStore(){ window.location.href = "store.html"; }

  function resetForm(){
    document.getElementById('title').value = '';
    document.getElementById('content').value = '';
  }

  function submitPost(){
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    if(!title || !content){ alert('請填寫標題與內容'); return; }

    const posts = JSON.parse(localStorage.getItem('posts') || '[]');
    posts.push({
      id: Date.now(),
      title, content,
      author: user.name,
      role: normalizeRole(user.role),
      createdAt: new Date().toISOString(),
      replies: []
    });
    localStorage.setItem('posts', JSON.stringify(posts));
    resetForm();
    renderPosts();
  }

  function canDeletePost(post){
    return isTeacher || post.author === user.name;
  }

  function deletePost(postId){
    if(!confirm("確認要刪除這篇貼文嗎？")) return;
    const posts = JSON.parse(localStorage.getItem('posts') || '[]');
    const next = posts.filter(p => p.id !== postId);
    localStorage.setItem('posts', JSON.stringify(next));
    renderPosts();
  }

  function submitReply(postId, inputId){
    const text = document.getElementById(inputId).value.trim();
    if(!text) return;

    const posts = JSON.parse(localStorage.getItem('posts') || '[]');
    const post = posts.find(p => p.id === postId);
    if(!post) return;

    post.replies.push({
      text,
      author: user.name,
      role: normalizeRole(user.role),
      createdAt: new Date().toISOString()
    });
    localStorage.setItem('posts', JSON.stringify(posts));
    renderPosts();
  }

  function replyToUser(postId, targetAuthor){
    const box = document.getElementById(`box-${postId}`);
    const input = document.getElementById(`reply-${postId}`);
    if(box) box.style.display = 'block';
    if(input){
      if(!input.value.startsWith('@'+targetAuthor)){
        input.value = `@${targetAuthor} ` + input.value;
      }
      input.focus();
    }
  }

  function deleteReply(postId, idx){
    const posts = JSON.parse(localStorage.getItem('posts') || '[]');
    const post = posts.find(p => p.id === postId);
    if(!post) return;
    const r = post.replies[idx];
    if(!r) return;
    const allow = isTeacher || r.author === user.name;
    if(!allow){ alert("你沒有權限刪除此留言。"); return; }
    if(!confirm("確認要刪除這則留言嗎？")) return;
    post.replies.splice(idx, 1);
    localStorage.setItem('posts', JSON.stringify(posts));
    renderPosts();
  }

  function timeAgo(iso){
    if(!iso) return "";
    const diff = (Date.now() - new Date(iso).getTime())/1000;
    if(diff < 60) return `${Math.floor(diff)} 秒前`;
    if(diff < 3600) return `${Math.floor(diff/60)} 分鐘前`;
    if(diff < 86400) return `${Math.floor(diff/3600)} 小時前`;
    return `${Math.floor(diff/86400)} 天前`;
  }

  function renderPosts(){
    const container = document.getElementById('posts');
    const empty = document.getElementById('emptyState');
    const posts = JSON.parse(localStorage.getItem('posts') || '[]');

    container.innerHTML = '';
    if(posts.length === 0){
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';

    [...posts].sort((a,b)=>b.id - a.id).forEach(post=>{
      const div = document.createElement('div');
      div.className = 'post';

      const authorBadgeClass = normalizeRole(post.role) === 'mentor' ? 'badge teacher' : 'badge';
      const actionsHtml = `
        <div class="actions">
          <button class="btn" onclick="toggleReply(${post.id})">回覆</button>
          ${canDeletePost(post) ? `<button class="btn danger" onclick="deletePost(${post.id})">刪除貼文</button>` : ''}
        </div>
      `;

      const repliesHtml = post.replies.map((r, i) => {
        const isTeacherReply = normalizeRole(r.role) === 'mentor';
        const replyCls = isTeacherReply ? 'reply-item teacher' : 'reply-item';
        const roleText = displayRole(r.role);
        const roleBadge = isTeacherReply ? `<span class="badge teacher">老師回覆</span>` : '';
        const canDeleteThis = isTeacher || r.author === user.name;
        const teacherControls = isTeacher ? `<button class="btn" onclick="replyToUser(${post.id}, '${escapeJs(r.author)}')">回覆</button>` : '';
        const deleteBtn = canDeleteThis ? `<button class="btn danger" onclick="deleteReply(${post.id}, ${i})">刪除</button>` : '';

        return `
          <div class="${replyCls}">
            <div>${escapeHtml(r.text)}</div>
            <div class="reply-meta">
              <span class="badge">${escapeHtml(r.author)}（${roleText}）</span>
              ${roleBadge}
              <span>·</span>
              <span>${timeAgo(r.createdAt)}</span>
              ${teacherControls}
              ${deleteBtn}
            </div>
          </div>
        `;
      }).join('');

      div.innerHTML = `
        <h3 class="post-title">${escapeHtml(post.title)}</h3>
        <div class="meta">
          <span class="${authorBadgeClass}">${escapeHtml(post.author)}（${displayRole(post.role)}）</span>
          <span>．</span>
          <span>${timeAgo(post.createdAt)}</span>
        </div>
        <div class="post-body">${escapeHtml(post.content).replace(/\\n/g,'<br/>')}</div>

        ${actionsHtml}

        <div class="reply-box" id="box-${post.id}" style="display:none;">
          <input type="text" id="reply-${post.id}" placeholder="${isTeacher ? '以老師身份回覆…（可自動@對象）' : '回覆這篇問題…'}" />
          <div class="row">
            <button class="btn primary" onclick="submitReply(${post.id}, 'reply-${post.id}')">送出回覆</button>
            <button class="btn" onclick="toggleReply(${post.id})">收起</button>
          </div>
        </div>

        ${repliesHtml}
      `;
      container.appendChild(div);
    });
  }

  function toggleReply(id){
    const el = document.getElementById(`box-${id}`);
    if(!el) return;
    el.style.display = (el.style.display === 'none' || !el.style.display) ? 'block' : 'none';
    const input = document.getElementById(`reply-${id}`);
    if(input){ input.focus(); }
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }
  function escapeJs(str){
    return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  }

  renderPosts();
</script>
</body>
</html>
