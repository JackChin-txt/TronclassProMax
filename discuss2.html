<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>討論區 - 學生與老師</title>
<style>
body {
    font-family: 'Arial';
    background-color: #f0f2f5;
    padding: 20px;
}
h1 {
    color: #333;
}
#postForm, .question {
    background: white;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 8px;
    box-shadow: 0 0 5px rgba(0,0,0,0.1);
}
textarea, input[type="text"] {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    font-size: 16px;
}
button {
    margin-top: 10px;
    padding: 8px 16px;
    font-size: 14px;
    background-color: #4caf50;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}
button:hover {
    background-color: #45a049;
}
.reply {
    background: #fafafa;
    margin-top: 10px;
    padding: 10px;
    border-left: 3px solid #ccc;
}
#backBtn {
    position: absolute;
    right: 20px;
    top: 20px;
    background-color: #cc4444;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
}
#userInfo {
    margin-bottom: 20px;
    color: #444;
    font-weight: bold;
}
</style>
</head>
<body>

<button id="backBtn" onclick="goBack()">🔙 登出並返回登入頁</button>
<h1>討論區</h1>
<div id="userInfo"></div>

<div id="postForm">
<h3>發表問題</h3>
<input type="text" id="title" placeholder="標題">
<textarea id="content" rows="4" placeholder="請輸入問題內容..."></textarea>
<button onclick="submitPost()">送出</button>
</div>

<div id="posts"></div>

<script>
const userAddress = localStorage.getItem("userAddress");
const userRole = localStorage.getItem("userRole");
const allUsers = JSON.parse(localStorage.getItem("userData") || "{}");
const userData = allUsers[userAddress];

if (!userAddress || !userRole || !userData) {
    alert("請先登入！");
    window.location.href = "login2.html";
}

const displayName = userData.studentID || userData.teacherID || "未知使用者";

document.getElementById("userInfo").innerText = `目前登入：${displayName}（${userRole}）`;

let user = {
    address: userAddress,
    role: userRole,
    name: displayName
};

function goBack() {
    localStorage.removeItem('userAddress');
    localStorage.removeItem('userRole');
    window.location.href = 'login2.html';
}

function submitPost() {
    const title = document.getElementById('title').value.trim();
    const content = document.getElementById('content').value.trim();
    if (!title || !content) return alert('請填寫標題與內容');

    const posts = JSON.parse(localStorage.getItem('posts') || '[]');
    posts.push({
        id: Date.now(),
        title,
        content,
        author: user.name,  // 顯示 studentID / teacherID
        role: user.role,
        replies: []
    });
    localStorage.setItem('posts', JSON.stringify(posts));
    document.getElementById('title').value = '';
    document.getElementById('content').value = '';
    renderPosts();
}

function deletePost(postId) {
    const posts = JSON.parse(localStorage.getItem('posts') || '[]');
    const newPosts = posts.filter(p => p.id !== postId || p.author !== user.name);
    localStorage.setItem('posts', JSON.stringify(newPosts));
    renderPosts();
}

function submitReply(postId, inputId) {
    const replyText = document.getElementById(inputId).value.trim();
    if (!replyText) return;
    const posts = JSON.parse(localStorage.getItem('posts') || '[]');
    const post = posts.find(p => p.id === postId);
    post.replies.push({ text: replyText, author: user.name, role: user.role });
    localStorage.setItem('posts', JSON.stringify(posts));
    renderPosts();
}

function renderPosts() {
    const posts = JSON.parse(localStorage.getItem('posts') || '[]');
    const container = document.getElementById('posts');
    container.innerHTML = '';
    posts.reverse().forEach(post => {
        const div = document.createElement('div');
        div.className = 'question';
        div.innerHTML = `
            <h3>${post.title}</h3>
            <p>${post.content}</p>
            <p><strong>作者：</strong>${post.author}（${post.role}）</p>
            ${post.author === user.name ? `<button onclick="deletePost(${post.id})">🗑 刪除</button>` : ''}
            <div>
                <input type="text" id="reply-${post.id}" placeholder="回覆這篇問題...">
                <button onclick="submitReply(${post.id}, 'reply-${post.id}')">回覆</button>
            </div>
            ${post.replies.map(r => `<div class='reply'><p>${r.text}</p><small>回覆者：${r.author}（${r.role}）</small></div>`).join('')}
        `;
        container.appendChild(div);
    });
}

renderPosts();

</script>
</body>
</html>
